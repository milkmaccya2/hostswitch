name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Lint, Build, Test & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # リリースタグは npm publish されるバージョンと一致していなければならない。
      # バージョン更新コミットを挟まずにタグだけ打つと、中身が前バージョンのまま
      # publish され、npm から分かりにくいエラーで落ちる（#102）。ここで先に弾く。
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag v$TAG does not match package.json version $PKG."
            echo "Did you forget to run 'npm version' before tagging?"
            exit 1
          fi
          echo "Tag v$TAG matches package.json version $PKG."

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

      - name: Publish
        run: npm publish --provenance --access public
